<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAROT'S</title>
    <script src="lang.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: #ffffff;
            display: flex; align-items: center;
            padding: 0 16px;
            z-index: 110;
        }
        .hamburger-btn {
            width: 40px; height: 40px;
            background: none; border: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 5px; cursor: pointer;
            flex-shrink: 0;
        }
        .hamburger-btn span {
            display: block; width: 22px; height: 2px;
            background: #000;
        }
        .topbar-title {
            flex: 1;
            text-align: center;
            font-size: 1.25rem; font-weight: 700;
            letter-spacing: 3px;
            color: #000;
        }
        .hand-btn {
            width: 40px; height: 40px;
            background: none; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; padding: 0;
        }
        .hand-btn img { width: 28px; height: 28px; object-fit: contain; }

        .wheel-container {
            position: absolute;
            top: 60px; bottom: 68px;
            left: 0; right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('wheelbackplan.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            isolation: isolate;
        }

        .wheel-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 450px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .slot-wrapper {
            position: relative;
            width: 100%;
        }

        .slot-window {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: transparent;
        }

        .selector-line {
            position: absolute;
            top: -32px; bottom: -32px;
            width: 1px;
            background: linear-gradient(180deg, transparent 5%, #000000 20%, #000000 80%, transparent 95%);
            z-index: 150;
            pointer-events: none;
        }
        .selector-left  { left: 0; }
        .selector-right { right: 0; }

        .wheel-card-wrap {
            position: absolute;
            aspect-ratio: 160 / 270;
            left: 50%;
            will-change: transform, opacity;
            border-radius: 8px;
            z-index: 10;
        }
        .wheel-card-wrap.slot-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        .wheel-card-wrap.slot-icon img {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
        }
        .wheel-card {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 8px;
        }

        .turn-spin-btn {
            width: 56px; height: 56px;
            background: none; border: none;
            padding: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.4s;
            margin-top: auto;
            margin-bottom: auto;
        }
        .turn-spin-btn img { width: 100%; height: 100%; object-fit: contain; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 68px;
            background: #ffffff;
            z-index: 110;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .nav-btn {
            background: none; border: none; padding: 0;
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .nav-btn.active { background: #f2f2f5; }
        .nav-btn img { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; }

        .sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 260px;
            background: #ffffff;
            z-index: 151;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex; flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.12);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #e8e8ed;
            font-size: 1.1rem; font-weight: 700;
            letter-spacing: 2px; color: #000;
        }
        .sidebar-menu { display: flex; flex-direction: column; }
        .sidebar-item {
            padding: 18px 20px;
            font-size: 1rem; color: #000;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
            display: flex; align-items: center; gap: 12px;
        }
        .sidebar-item:active { background: #f5f5f7; }

        .auth-check {
            position: fixed; inset: 0;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            z-index: 300;
        }
        .auth-check.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e8e8ed;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="auth-check" id="authCheck">
        <div class="spinner"></div>
    </div>

    <div class="topbar">
        <button class="hamburger-btn" id="menuBtn" aria-label="Menü">
            <span></span><span></span><span></span>
        </button>
        <div class="topbar-title">TAROT'S</div>
        <button class="hand-btn" id="handBtn" aria-label="Kart Seçimi">
            <img src="hand.png" alt="Kart Seçimi">
        </button>
    </div>

    <div class="wheel-container">
        <div class="wheel-inner">
            <div class="slot-wrapper" id="slotWrapper">
                <div class="selector-line selector-left"></div>
                <div class="selector-line selector-right"></div>
                <div class="slot-window" id="slotWindow"></div>
            </div>
        </div>

        <button class="turn-spin-btn" id="turnSpinBtn">
            <img src="finger.png" alt="Döndür">
        </button>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-btn" id="navHome" style="text-decoration: none; display: flex;" aria-label="">
            <img src="cardsinfo.png" alt="Ana Sayfa">
        </a>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">TAROT'S</div>
        <div class="sidebar-menu">
            <div class="sidebar-item" onclick="window.location.href='cardsinfo.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M6 8h.01M6 12h.01M6 16h.01"/>
                </svg>
                <span id="sidebarCardsText">Kartlar</span>
            </div>
            <div class="sidebar-item" onclick="logout()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span id="sidebarLogoutText">Çıkış</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sidebarCardsText').textContent  = typeof t === 'function' ? t('sidebarCards')  : 'Kartlar';
        document.getElementById('sidebarLogoutText').textContent = typeof t === 'function' ? t('sidebarLogout') : 'Çıkış';
        document.getElementById('navHome').setAttribute('aria-label', typeof t === 'function' ? t('navHomeLabel') : 'Anasayfa');

        const auth = typeof firebase !== 'undefined' ? firebase.auth() : { onAuthStateChanged: (cb) => cb({}), signOut: () => Promise.resolve() };
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'auth.html'; return; }
            document.getElementById('authCheck').classList.add('hidden');
        });

        function openSidebar() {
            document.getElementById('sidebarOverlay').classList.add('active');
            document.getElementById('sidebar').classList.add('active');
        }
        function closeSidebar() {
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.getElementById('sidebar').classList.remove('active');
        }
        function logout() { auth.signOut().then(() => { window.location.href = 'auth.html'; }); }
        document.getElementById('menuBtn').addEventListener('click', openSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        document.getElementById('handBtn').addEventListener('click', () => { window.location.href = 'cards.html#single'; });

        /* ========== SES ========== */
        let audioCtx = null, noiseNode = null, noiseGain = null;
        let lastCardIndex = -1, spinActive = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function createSoftNoiseBuffer() {
            const buf = audioCtx.sampleRate * 1;
            const buffer = audioCtx.createBuffer(1, buf, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buf; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
            return buffer;
        }
        function startSpinSound() {
            if (!audioCtx || spinActive) return;
            spinActive = true;
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = createSoftNoiseBuffer();
            noiseNode.loop = true;
            const lf = audioCtx.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 300; lf.Q.value = 0.5;
            const bf = audioCtx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 200; bf.Q.value = 1;
            noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.04;
            noiseNode.connect(lf); lf.connect(bf); bf.connect(noiseGain); noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        }
        function stopSpinSound() {
            spinActive = false;
            if (noiseNode) { try { noiseNode.disconnect(); noiseNode.stop(audioCtx.currentTime + 0.1); } catch(e){} noiseNode = null; }
            if (noiseGain) { try { noiseGain.disconnect(); } catch(e){} noiseGain = null; }
        }
        function playTickSound(intensity) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
            osc.type = 'sine'; osc.frequency.value = 600 + Math.random() * 200;
            filter.type = 'lowpass'; filter.frequency.value = 1200;
            const vol = 0.015 * Math.min(intensity, 1);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }
        function playStopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }

        /* ========== ÇARK ========== */
        const container = document.getElementById('slotWindow');
        const numCards  = 78;
        let cards = [];
        let isSnapping = false;
        let snapDone = false, hasSpun = false;

        const slotWidth        = container.clientWidth;
        const cardGap          = 12;
        const cardWidthPx      = (slotWidth - 2 * cardGap) / 3;
        const actualCardHeight = cardWidthPx * (270 / 160);

        container.style.height = actualCardHeight + 'px';

        const wrapperWidth = document.getElementById('slotWrapper').clientWidth;
        const lineGap      = 10;
        const lineOffset   = (wrapperWidth - cardWidthPx) / 2 - lineGap;
        document.querySelector('.selector-left').style.left   = lineOffset + 'px';
        document.querySelector('.selector-right').style.right = lineOffset + 'px';

        const cardHeight  = actualCardHeight + 15;
        const totalItems  = numCards + 1;   // 78 kart + 1 question ikonu
        const totalHeight = totalItems * cardHeight;

        // FIX: question.png (index 78) başlangıçta merkeze gelsin
        // centerY = containerH/2 - actualCardHeight/2 = 0 (containerH === actualCardHeight)
        // icon y = (78 * cardHeight) + offsetY → 0 olması için offsetY = -(78 * cardHeight)
        let offsetY  = -(numCards * cardHeight);
        let velocity = 0;

        for (let i = 0; i < totalItems; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'wheel-card-wrap';
            const isIcon = i === (totalItems - 1);
            if (isIcon) wrap.classList.add('slot-icon');
            wrap.style.width = cardWidthPx + 'px';

            const img = document.createElement('img');
            img.src = isIcon ? 'question.png' : 'onecard.png';
            img.className = 'wheel-card';
            wrap.appendChild(img);

            container.appendChild(wrap);
            cards.push(wrap);
        }

        function renderCards() {
            const containerH = container.clientHeight;
            const centerY    = containerH / 2 - actualCardHeight / 2;
            let minOffset = Infinity, activeIndex = -1;

            cards.forEach((wrap, i) => {
                let y = (i * cardHeight + offsetY) % totalHeight;
                if (y < 0) y += totalHeight;
                const d1 = Math.abs(y - centerY);
                const d2 = Math.abs(y - totalHeight - centerY);
                const d3 = Math.abs(y + totalHeight - centerY);
                let dist = Math.min(d1, d2, d3);
                let renderY = y;
                if (dist === d2) renderY = y - totalHeight;
                if (dist === d3) renderY = y + totalHeight;

                wrap.style.transform = `translate(-50%, ${renderY}px)`;
                wrap.style.zIndex    = 100 - Math.floor(dist / 10);

                if (dist < minOffset) { minOffset = dist; activeIndex = i; }
            });

            if (activeIndex !== lastCardIndex && hasSpun && !snapDone && Math.abs(velocity) > 8) {
                playTickSound(Math.min(Math.abs(velocity) / 60, 1));
                lastCardIndex = activeIndex;
            }
            return activeIndex;
        }

        let isSpinning = false;
        const turnSpinBtn = document.getElementById('turnSpinBtn');

        function animate() {
            const containerH = container.clientHeight;

            if (!isSnapping) {
                offsetY  += velocity;
                velocity *= 0.985;
                if (Math.abs(velocity) < 1.5 && hasSpun) { velocity = 0; isSnapping = true; }
            } else {
                const centerY    = containerH / 2 - actualCardHeight / 2;
                const targetOffY = centerY - Math.round((centerY - offsetY) / cardHeight) * cardHeight;
                const diff       = targetOffY - offsetY;
                offsetY += diff * 0.15;
                if (Math.abs(diff) < 0.5 && !snapDone) {
                    offsetY  = targetOffY;
                    snapDone = true;
                    renderCards();
                    isSpinning = false;
                    stopSpinSound();
                    playStopSound();
                    if (navigator.vibrate) navigator.vibrate(50);
                    setTimeout(() => {
                        const drawnCard = { id: Math.floor(Math.random() * 78), reversed: Math.random() < 0.5 };
                        sessionStorage.setItem('tarotDrawnCards', JSON.stringify([drawnCard]));
                        sessionStorage.setItem('tarotReadingType', 'single');
                        window.location.href = 'ad.html';
                    }, 1000);
                }
            }

            if (!snapDone) renderCards();

            requestAnimationFrame(animate);
        }

        renderCards();
        requestAnimationFrame(animate);

        /* ========== TURN BUTONU ========== */
        turnSpinBtn.addEventListener('click', function () {
            if (isSpinning) return;

            initAudio();
            isSpinning  = true;
            hasSpun     = true;
            snapDone    = false;
            isSnapping  = false;
            lastCardIndex = -1;
            velocity    = 120 + Math.random() * 30;
            startSpinSound();
        });
    </script>
</body>
</html>
