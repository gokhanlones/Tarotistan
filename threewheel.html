<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAROT'S</title>
    <script src="lang.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        /* ── Reset ──────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── Base ───────────────────────────────────────────── */
        html, body {
            width: 100%; height: 100%;
            background: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Auth Splash ─────────────────────────────────────── */
        .auth-check {
            position: fixed; inset: 0;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            z-index: 300;
        }
        .auth-check.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e8e8ed;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Topbar ──────────────────────────────────────────── */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px; background: #ffffff;
            display: flex; align-items: center;
            padding: 0 16px; z-index: 110;
        }
        .hamburger-btn {
            width: 40px; height: 40px;
            background: none; border: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 5px; cursor: pointer; flex-shrink: 0;
        }
        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: #000;
        }
        .topbar-title {
            flex: 1;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #000;
        }
        .hand-btn {
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
        }
        .hand-btn img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* ── Wheel Container ─────────────────────────────────── */
        .wheel-container {
            position: absolute;
            top: 60px;
            bottom: 68px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('wheelbackplan.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            isolation: isolate;
        }
        .wheel-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 450px;
            margin: auto;
        }

        /* ── Slot Wheel ──────────────────────────────────────── */
        .slot-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        .slot-column {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .slot-window {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* Orta sütunun sol/sağ çizgileri */
        .slot-column:nth-child(2) .selector-line {
            position: absolute;
            top: -24px;
            bottom: -24px;
            width: 1px;
            background: linear-gradient(
                180deg,
                transparent 5%,
                #000000 20%,
                #000000 80%,
                transparent 95%
            );
            z-index: 150;
            pointer-events: none;
        }
        .slot-column:nth-child(2) .selector-left {
            left: -6px;
        }
        .slot-column:nth-child(2) .selector-right {
            right: -6px;
        }

        /* ── Kart / İkon Sarmalayıcı ─────────────────────────── */
        .wheel-card-wrap {
            position: absolute;
            width: 100%;
            aspect-ratio: 160 / 270;
            left: 50%;
            will-change: transform;
            border-radius: 8px;
            z-index: 10;
        }

        .wheel-card-wrap.slot-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            z-index: 150;
        }

        .wheel-card-wrap.slot-icon img {
            width: 50%;
            height: auto;
            max-height: 50%;
            object-fit: contain;
        }

        .wheel-card {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 8px;
        }

        /* ── Döndür Butonu ───────────────────────────────────── */
        .turn-spin-btn {
            width: 56px;
            height: 56px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.4s;
            margin: auto;
        }
        .turn-spin-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Bottom Nav ─────────────────────────────────────── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: #ffffff;
            z-index: 110;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .nav-btn {
            background: none;
            border: none;
            padding: 0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .nav-btn img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 6px;
        }

        /* ── Sidebar ─────────────────────────────────────────── */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            background: #ffffff;
            z-index: 151;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.12);
        }
        .sidebar.active {
            transform: translateX(0);
        }
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #e8e8ed;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000;
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
        }
        .sidebar-item {
            padding: 18px 20px;
            font-size: 1rem;
            color: #000;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-item:active {
            background: #f5f5f7;
        }
    </style>
</head>
<body>

    <!-- Auth yüklenirken ekran -->
    <div class="auth-check" id="authCheck">
        <div class="spinner"></div>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <button class="hamburger-btn" id="menuBtn" aria-label="Menü">
            <span></span><span></span><span></span>
        </button>

        <div class="topbar-title">TAROT'S</div>

        <button class="hand-btn" id="handBtn" aria-label="Kart Seçimi">
            <img src="hand.png" alt="Kart Seçimi">
        </button>
    </div>

    <!-- Çark -->
    <div class="wheel-container">
        <div class="wheel-inner">
            <div class="slot-wrapper" id="slotWrapper">

                <div class="slot-column" data-col="0">
                    <div class="slot-window" id="slotWindow0"></div>
                </div>

                <div class="slot-column" data-col="1">
                    <div class="selector-line selector-left"></div>
                    <div class="selector-line selector-right"></div>
                    <div class="slot-window" id="slotWindow1"></div>
                </div>

                <div class="slot-column" data-col="2">
                    <div class="slot-window" id="slotWindow2"></div>
                </div>

            </div>
        </div>

        <button class="turn-spin-btn" id="turnSpinBtn">
            <img src="finger.png" alt="Döndür">
        </button>
    </div>

    <!-- Alt Navigasyon -->
    <div class="bottom-nav">
        <a href="dashboard.html"
           class="nav-btn"
           id="navHome"
           style="text-decoration:none;display:flex;"
           aria-label="Anasayfa">
            <img src="cardsinfo.png" alt="Ana Sayfa">
        </a>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebar">

        <div class="sidebar-header">TAROT'S</div>

        <div class="sidebar-menu">

            <div class="sidebar-item"
                 onclick="window.location.href='cardsinfo.html'">

                <svg width="20"
                     height="20"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="#000"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M6 8h.01M6 12h.01M6 16h.01"/>

                </svg>

                <span id="sidebarCardsText">Kartlar</span>
            </div>

            <div class="sidebar-item"
                 onclick="logout()">

                <svg width="20"
                     height="20"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="#000"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>

                </svg>

                <span id="sidebarLogoutText">Çıkış</span>
            </div>

        </div>
    </div>

    <script>

    /* ════════════════════════════════════════════════════════════
       1. I18N — çeviri metinleri
    ════════════════════════════════════════════════════════════ */

    document.getElementById('sidebarCardsText').textContent =
        typeof t === 'function'
            ? t('sidebarCards')
            : 'Kartlar';

    document.getElementById('sidebarLogoutText').textContent =
        typeof t === 'function'
            ? t('sidebarLogout')
            : 'Çıkış';

    document.getElementById('navHome').setAttribute(
        'aria-label',
        typeof t === 'function'
            ? t('navHomeLabel')
            : 'Anasayfa'
    );


    /* ════════════════════════════════════════════════════════════
       2. AUTH
    ════════════════════════════════════════════════════════════ */

    const auth = typeof firebase !== 'undefined'
        ? firebase.auth()
        : {
            onAuthStateChanged: cb => cb({}),
            signOut: () => Promise.resolve()
        };

    auth.onAuthStateChanged(user => {

        if (!user) {
            window.location.href = 'auth.html';
            return;
        }

        document.getElementById('authCheck')
            .classList.add('hidden');
    });

    function logout() {
        auth.signOut().then(() => {
            window.location.href = 'auth.html';
        });
    }


    /* ════════════════════════════════════════════════════════════
       3. SIDEBAR
    ════════════════════════════════════════════════════════════ */

    function openSidebar() {
        document.getElementById('sidebarOverlay')
            .classList.add('active');

        document.getElementById('sidebar')
            .classList.add('active');
    }

    function closeSidebar() {
        document.getElementById('sidebarOverlay')
            .classList.remove('active');

        document.getElementById('sidebar')
            .classList.remove('active');
    }

    document.getElementById('menuBtn')
        .addEventListener('click', openSidebar);

    document.getElementById('sidebarOverlay')
        .addEventListener('click', closeSidebar);

    document.getElementById('handBtn')
        .addEventListener('click', () => {
            window.location.href = 'cards.html#three';
        });


    /* ════════════════════════════════════════════════════════════
       4. SES MOTORU
    ════════════════════════════════════════════════════════════ */

    let audioCtx = null;
    let noiseNode = null;
    let noiseGain = null;
    let spinActive = false;

    function initAudio() {

        if (!audioCtx)
            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        if (audioCtx.state === 'suspended')
            audioCtx.resume();
    }

    function createSoftNoiseBuffer() {

        const len = audioCtx.sampleRate;

        const buffer = audioCtx.createBuffer(
            1,
            len,
            audioCtx.sampleRate
        );

        const data = buffer.getChannelData(0);

        for (let i = 0; i < len; i++)
            data[i] = (Math.random() * 2 - 1) * 0.3;

        return buffer;
    }

    function startSpinSound() {

        if (!audioCtx || spinActive)
            return;

        spinActive = true;

        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = createSoftNoiseBuffer();
        noiseNode.loop = true;

        const lf = audioCtx.createBiquadFilter();
        lf.type = 'lowpass';
        lf.frequency.value = 300;
        lf.Q.value = 0.5;

        const bf = audioCtx.createBiquadFilter();
        bf.type = 'bandpass';
        bf.frequency.value = 200;
        bf.Q.value = 1;

        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.04;

        noiseNode.connect(lf);
        lf.connect(bf);
        bf.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noiseNode.start();
    }

    function stopSpinSound() {

        spinActive = false;

        if (noiseNode) {

            try {
                noiseNode.disconnect();
                noiseNode.stop(
                    audioCtx.currentTime + 0.1
                );
            }
            catch (e) {}

            noiseNode = null;
        }

        if (noiseGain) {

            try {
                noiseGain.disconnect();
            }
            catch (e) {}

            noiseGain = null;
        }
    }

    function playTickSound(intensity) {

        if (!audioCtx)
            return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sine';

        osc.frequency.value =
            600 + Math.random() * 200;

        filter.type = 'lowpass';
        filter.frequency.value = 1200;

        const vol =
            0.015 * Math.min(intensity, 1);

        gain.gain.setValueAtTime(
            vol,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.04
        );

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(
            audioCtx.currentTime + 0.04
        );
    }

    function playStopSound() {

        if (!audioCtx)
            return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';

        osc.frequency.setValueAtTime(
            350,
            audioCtx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            150,
            audioCtx.currentTime + 0.25
        );

        gain.gain.setValueAtTime(
            0.04,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.25
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(
            audioCtx.currentTime + 0.25
        );
    }


    /* ════════════════════════════════════════════════════════════
       5. ÇARK — boyut hesaplama
    ════════════════════════════════════════════════════════════ */

    const NUM_CARDS = 78;
    const ICON_SRCS = [
        'history.png',
        'now.png',
        'coming.png'
    ];

    const GAP_PX = 12;
    const COL_COUNT = 3;

    const wrapper =
        document.getElementById('slotWrapper');

    const containers = [
        document.getElementById('slotWindow0'),
        document.getElementById('slotWindow1'),
        document.getElementById('slotWindow2')
    ];

    const cardWidthPx =
        (wrapper.clientWidth -
            GAP_PX * (COL_COUNT - 1)) /
        COL_COUNT;

    const actualCardHeight =
        cardWidthPx * (270 / 160);

    const cardHeight =
        actualCardHeight + 15;

    const cardsTotalHeight =
        NUM_CARDS * cardHeight;

    containers.forEach(c => {
        c.style.height =
            actualCardHeight + 'px';
    });


    /* ════════════════════════════════════════════════════════════
       6. ÇARK — kolon durumu
    ════════════════════════════════════════════════════════════ */

    function makeCol() {

        return {
            iconEl: null,
            cards: [],
            offsetY: 0,
            velocity: 0,
            isSnapping: false,
            snapDone: false,
            hasSpun: false,
            lastIndex: -1
        };
    }

    const cols = [
        makeCol(),
        makeCol(),
        makeCol()
    ];


    /* ════════════════════════════════════════════════════════════
       7. ÇARK — DOM elemanları oluştur
    ════════════════════════════════════════════════════════════ */

    for (let col = 0; col < COL_COUNT; col++) {

        const containerH =
            containers[col].clientHeight;

        const centerY =
            containerH / 2 -
            actualCardHeight / 2;

        cols[col].offsetY = 0;


        /* ── İkon ───────────────────────────────────────────── */

        const iconWrap =
            document.createElement('div');

        iconWrap.className =
            'wheel-card-wrap slot-icon';

        iconWrap.style.width =
            cardWidthPx + 'px';

        const iconImg =
            document.createElement('img');

        iconImg.className =
            'wheel-card';

        iconImg.src =
            ICON_SRCS[col];

        iconWrap.appendChild(iconImg);

        containers[col].appendChild(
            iconWrap
        );

        cols[col].iconEl =
            iconWrap;


        /* ── Kartlar ────────────────────────────────────────── */

        for (let i = 0; i < NUM_CARDS; i++) {

            const wrap =
                document.createElement('div');

            wrap.className =
                'wheel-card-wrap';

            wrap.style.width =
                cardWidthPx + 'px';

            /*
             * ÖNEMLİ:
             * Başlangıçta kartları gizliyoruz.
             * Böylece history / now / coming ikonlarının
             * arkasında kart görünmeyecek.
             */
            wrap.style.visibility = 'hidden';

            const img =
                document.createElement('img');

            img.className =
                'wheel-card';

            img.src =
                'onecard.png';

            wrap.appendChild(img);

            containers[col].appendChild(
                wrap
            );

            cols[col].cards.push(
                wrap
            );
        }
    }


    /* ════════════════════════════════════════════════════════════
       8. RENDER — tek bir kolonu çiz
    ════════════════════════════════════════════════════════════ */

    function renderColumn(colIdx) {

        const col = cols[colIdx];

        const containerH =
            containers[colIdx].clientHeight;

        const centerY =
            containerH / 2 -
            actualCardHeight / 2;


        /* ── İkon Konumu ───────────────────────────────────── */

        const iconY =
            centerY + col.offsetY;

        if (col.iconEl) {

            if (
                iconY >
                containerH + actualCardHeight
            ) {

                col.iconEl.style.display =
                    'none';

            } else {

                col.iconEl.style.display =
                    'flex';

                col.iconEl.style.transform =
                    `translate(-50%, ${iconY}px)`;
            }
        }


        /* ── Kartların Akışı ───────────────────────────────── */

        let minDist = Infinity;
        let activeIndex = -1;

        col.cards.forEach((wrap, i) => {

            /*
             * Başlangıçta kartları görünmez tut.
             * İlk hareket başladığında görünür hale getir.
             */
            if (col.hasSpun) {
                wrap.style.visibility = 'visible';
            }

            let y =
                (i * cardHeight +
                    col.offsetY) %
                cardsTotalHeight;

            if (y < 0)
                y += cardsTotalHeight;

            const d1 =
                Math.abs(y - centerY);

            const d2 =
                Math.abs(
                    y -
                    cardsTotalHeight -
                    centerY
                );

            const d3 =
                Math.abs(
                    y +
                    cardsTotalHeight -
                    centerY
                );

            const dist =
                Math.min(d1, d2, d3);

            let renderY = y;

            if (dist === d2)
                renderY =
                    y - cardsTotalHeight;

            if (dist === d3)
                renderY =
                    y + cardsTotalHeight;

            wrap.style.transform =
                `translate(-50%, ${renderY}px)`;

            wrap.style.zIndex =
                100 - Math.floor(dist / 10);

            if (dist < minDist) {
                minDist = dist;
                activeIndex = i;
            }
        });


        /* ── Tik sesi ───────────────────────────────────────── */

        if (
            activeIndex !== col.lastIndex &&
            col.hasSpun &&
            !col.snapDone &&
            Math.abs(col.velocity) > 8
        ) {

            playTickSound(
                Math.min(
                    Math.abs(col.velocity) / 60,
                    1
                )
            );

            col.lastIndex =
                activeIndex;
        }

        return activeIndex;
    }


    /* ════════════════════════════════════════════════════════════
       9. ANİMASYON DÖNGÜSÜ
    ════════════════════════════════════════════════════════════ */

    let resultSent = false;
    let spinTimeoutId = null;
    let isSpinning = false;

    const turnSpinBtn =
        document.getElementById(
            'turnSpinBtn'
        );

    function allStopped() {
        return cols.every(
            c => c.snapDone
        );
    }

    function allSpun() {
        return cols.every(
            c => c.hasSpun
        );
    }

    function animate() {

        for (
            let i = 0;
            i < COL_COUNT;
            i++
        ) {

            const col = cols[i];

            const containerH =
                containers[i].clientHeight;

            if (!col.isSnapping) {

                col.offsetY +=
                    col.velocity;

                col.velocity *=
                    0.985;

                if (
                    Math.abs(col.velocity) < 1.5 &&
                    col.hasSpun
                ) {

                    col.velocity = 0;

                    col.isSnapping = true;
                }

            } else {

                const centerY =
                    containerH / 2 -
                    actualCardHeight / 2;

                const targetOffY =
                    centerY -
                    Math.round(
                        (centerY - col.offsetY) /
                        cardHeight
                    ) * cardHeight;

                const diff =
                    targetOffY -
                    col.offsetY;

                col.offsetY +=
                    diff * 0.15;

                if (
                    Math.abs(diff) < 0.5 &&
                    !col.snapDone
                ) {

                    col.offsetY =
                        targetOffY;

                    col.snapDone =
                        true;
                }
            }

            if (!col.snapDone)
                renderColumn(i);
        }


        /* ── Sonuç ─────────────────────────────────────────── */

        if (
            allStopped() &&
            allSpun() &&
            !resultSent
        ) {

            resultSent = true;
            isSpinning = false;

            stopSpinSound();
            playStopSound();

            if (navigator.vibrate)
                navigator.vibrate(50);

            cols.forEach(c => {
                c.hasSpun = false;
                c.snapDone = false;
            });

            spinTimeoutId =
                setTimeout(() => {

                    const drawnCards = [];
                    const usedIds = new Set();

                    while (
                        drawnCards.length <
                        COL_COUNT
                    ) {

                        const id =
                            Math.floor(
                                Math.random() *
                                NUM_CARDS
                            );

                        if (!usedIds.has(id)) {

                            usedIds.add(id);

                            drawnCards.push({
                                id: id,
                                reversed:
                                    Math.random() < 0.5
                            });
                        }
                    }

                    sessionStorage.setItem(
                        'tarotDrawnCards',
                        JSON.stringify(
                            drawnCards
                        )
                    );

                    sessionStorage.setItem(
                        'tarotReadingType',
                        'three'
                    );

                    window.location.href =
                        'ad.html';

                }, 1000);
        }

        requestAnimationFrame(
            animate
        );
    }


    /* ════════════════════════════════════════════════════════════
       10. BAŞLAT
    ════════════════════════════════════════════════════════════ */

    /*
     * İlk render:
     * Sadece history / now / coming ikonları görünür.
     * Kartlar visibility:hidden olduğu için
     * ikonların arkasında kart görünmez.
     */
    for (
        let i = 0;
        i < COL_COUNT;
        i++
    ) {
        renderColumn(i);
    }

    requestAnimationFrame(
        animate
    );


    /* ════════════════════════════════════════════════════════════
       11. DÖNDÜR
    ════════════════════════════════════════════════════════════ */

    turnSpinBtn.addEventListener(
        'click',
        () => {

            if (isSpinning)
                return;

            initAudio();

            if (spinTimeoutId) {

                clearTimeout(
                    spinTimeoutId
                );

                spinTimeoutId = null;
            }

            isSpinning = true;
            resultSent = false;


            cols.forEach(col => {

                /*
                 * Kartlar artık görünür.
                 * İkonlar aşağı doğru akıp
                 * ekrandan çıkacak.
                 */
                col.cards.forEach(card => {
                    card.style.visibility =
                        'visible';
                });

                col.isSnapping = false;
                col.snapDone = false;
                col.lastIndex = -1;
                col.hasSpun = true;

                col.velocity =
                    120 +
                    Math.random() * 40;
            });

            startSpinSound();
        }
    );

    </script>
</body>
</html>
