<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAROT'S</title>
    <script src="lang.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: #ffffff;
            display: flex; align-items: center;
            padding: 0 16px;
            z-index: 10;
        }
        .hamburger-btn {
            width: 40px; height: 40px;
            background: none; border: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 5px; cursor: pointer;
            flex-shrink: 0;
        }
        .hamburger-btn span {
            display: block; width: 22px; height: 2px;
            background: #000;
        }
        .topbar-title {
            flex: 1;
            text-align: center;
            font-size: 1.25rem; font-weight: 700;
            letter-spacing: 3px;
            color: #000;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .turn-btn {
            width: 32px; height: 32px;
            background: none; border: none;
            padding: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .turn-btn img {
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .topbar-counter {
            min-width: 28px;
            text-align: right;
            font-size: 1rem; font-weight: 700;
            color: #000;
        }

        .content {
            padding: 76px 12px 88px;
            max-width: 600px;
            margin: 0 auto;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .card-item {
            aspect-ratio: 9 / 16;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: cardAppear 0.4s ease-out forwards;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-item.selected {
            box-shadow: 0 0 14px 4px rgba(255, 141, 184, 0.75);
            transform: scale(1.06);
            z-index: 2;
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 68px;
            background: #ffffff;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 56px;
        }
        .nav-btn {
            background: none; border: none; padding: 0;
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .nav-btn.active { background: #f2f2f5; }
        .nav-btn svg { width: 26px; height: 26px; }
        .nav-btn img {
            width: 34px; height: 34px;
            object-fit: contain; border-radius: 6px;
        }
        
        .btn-continue-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            background: transparent;
        }
        .btn-continue-container.visible {
            display: flex;
        }
        
        .roman-numeral-wrapper {
            display: flex;
            font-family: 'Times New Roman', Times, serif;
            font-size: 6.5rem; /* %300 oranında büyütüldü */
            font-weight: bold;
            color: #000;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
            letter-spacing: 6px;
        }

        .roman-numeral-wrapper span {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .roman-numeral-wrapper span.hidden {
            opacity: 0;
            transform: scale(0.5);
        }

        .btn-close-anim {
            margin-top: 15px;
            background: #000;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="topbar">
        <button class="hamburger-btn" id="menuBtn" aria-label="Menü">
            <span></span><span></span><span></span>
        </button>
        <div class="topbar-title" id="topbarTitle"></div>
        <div class="topbar-right">
            <button class="turn-btn" id="turnBtn" aria-label="Çarka dön">
                <img src="turn.png" alt="">
            </button>
            <div class="topbar-counter" id="topbarCounter"></div>
        </div>
    </div>

    <div class="content">
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <div class="submit-bar" id="submitBar"></div>

    <div class="btn-continue-container" id="continueContainer">
        <div class="roman-numeral-wrapper" id="romanWrapper">
            <span id="roman1">I</span><span id="roman2">I</span><span id="roman3">I</span>
        </div>
        <button class="btn-close-anim" id="closeAnimBtn">X</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" id="navHome" onclick="window.location.href='dashboard.html'">
            <img src="cardsinfo.png" alt="">
        </button>
    </div>

    <script>
        document.getElementById('topbarTitle').textContent = 'TAROT\'S';
        document.getElementById('menuBtn').setAttribute('aria-label', t('menuLabel'));
        document.getElementById('navHome').setAttribute('aria-label', t('navHomeLabel'));

        const readingType = sessionStorage.getItem('tarotReadingType');
        const intent = sessionStorage.getItem('tarotIntent');

        if (!readingType || !intent) {
            window.location.href = 'dashboard.html';
        }

        const maxSelect = readingType === 'single' ? 1 : 3;
        let selectedCount = 0;
        let animationTimeouts = [];

        const grid = document.getElementById('cardsGrid');
        const topbarCounter = document.getElementById('topbarCounter');
        const continueContainer = document.getElementById('continueContainer');
        const closeAnimBtn = document.getElementById('closeAnimBtn');
        const romanWrapper = document.getElementById('romanWrapper');

        if (maxSelect === 1) {
            romanWrapper.innerHTML = '<span id="roman1">I</span>';
        }

        document.getElementById('turnBtn').addEventListener('click', function () {
            window.location.href = readingType === 'single' ? 'wheel.html' : 'threewheel.html';
        });

        function updateInfo() {
            topbarCounter.textContent = maxSelect + '/' + selectedCount;
        }

        function updateContinueButton() {
            if (selectedCount === maxSelect) {
                continueContainer.classList.add('visible');
                resetRomanVisibility();
                startRomanAnimation(); // Tıklama beklenmeden otomatik başlar
            } else {
                continueContainer.classList.remove('visible');
                clearAnimationTimeouts();
            }
        }

        function resetRomanVisibility() {
            const spans = romanWrapper.querySelectorAll('span');
            spans.forEach(span => span.classList.remove('hidden'));
        }

        function clearAnimationTimeouts() {
            animationTimeouts.forEach(timeout => clearTimeout(timeout));
            animationTimeouts = [];
        }

        const TOTAL_CARDS = 78;
        for (let i = 0; i < TOTAL_CARDS; i++) {
            const card = document.createElement('div');
            card.className = 'card-item';
            card.style.animationDelay = (i * 0.025) + 's';

            const img = document.createElement('img');
            img.src = 'onecard.png';
            img.alt = t('cardAlt');
            img.loading = 'lazy';

            card.appendChild(img);
            grid.appendChild(card);

            card.addEventListener('click', function() {
                if (continueContainer.classList.contains('visible')) return;

                if (card.classList.contains('selected')) {
                    card.classList.remove('selected');
                    selectedCount--;
                } else {
                    if (selectedCount < maxSelect) {
                        card.classList.add('selected');
                        selectedCount++;
                    }
                }
                updateInfo();
                updateContinueButton();
            });
        }

        updateInfo();

        closeAnimBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            clearAnimationTimeouts();
            continueContainer.classList.remove('visible');
            resetRomanVisibility();

            document.querySelectorAll('.card-item.selected').forEach(card => {
                card.classList.remove('selected');
            });
            selectedCount = 0;
            updateInfo();
        });

        function startRomanAnimation() {
            clearAnimationTimeouts();
            resetRomanVisibility();

            if (maxSelect === 3) {
                // 1. saniye: Sağdaki rakamı kaybet
                animationTimeouts.push(setTimeout(() => {
                    document.getElementById('roman3').classList.add('hidden');
                }, 1000));

                // 2. saniye: Soldaki rakamı kaybet
                animationTimeouts.push(setTimeout(() => {
                    document.getElementById('roman1').classList.add('hidden');
                }, 2000));

                // 3. saniye: Ortadaki rakamı kaybet ve yönlendir
                animationTimeouts.push(setTimeout(() => {
                    document.getElementById('roman2').classList.add('hidden');
                    proceedToAd();
                }, 3000));
            } else {
                // Tekli seçimse 1 saniye sonra direkt yönlendir
                animationTimeouts.push(setTimeout(() => {
                    document.getElementById('roman1').classList.add('hidden');
                    proceedToAd();
                }, 1000));
            }
        }

        function proceedToAd() {
            const deck = Array.from({length: 78}, (_, i) => i);
            const shuffled = shuffle(deck);
            const drawnIds = shuffled.slice(0, maxSelect);

            const drawnCards = drawnIds.map(id => ({
                id: id,
                reversed: Math.random() < 0.5
            }));

            sessionStorage.setItem('tarotDrawnCards', JSON.stringify(drawnCards));
            window.location.href = 'ad.html';
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.getElementById('menuBtn').addEventListener('click', function() {
            console.log('Menü açılacak');
        });
    </script>
</body>
</html>
