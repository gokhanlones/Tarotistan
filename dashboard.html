            align-items: center;

        .three-card-container {

            align-items: center;

    <script>
        const auth = firebase.auth();
        const db = firebase.firestore();
        const remoteConfig = firebase.remoteConfig();

        remoteConfig.settings = { minimumFetchIntervalMillis: 0 };

        function isWithin24h(timestamp) {
            if (!timestamp) return false;
            const now = Date.now();
            const recordTime = timestamp.toDate ? timestamp.toDate().getTime() : new Date(timestamp).getTime();
            return (now - recordTime) < (24 * 60 * 60 * 1000);
        }

        function formatRemainingTime(timestamp) {
            if (!timestamp) return '';
            const recordTime = timestamp.toDate ? timestamp.toDate().getTime() : new Date(timestamp).getTime();
            const elapsed = Date.now() - recordTime;
            const remaining = (24 * 60 * 60 * 1000) - elapsed;
            if (remaining <= 0) return '';
            const hours = Math.floor(remaining / (60 * 60 * 1000));
            const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
            return hours + 's ' + minutes + 'dk';
        }

                { name: 'Akrep',   start: [10, 23], end: [11, 21] },
                { name: 'Yay',     start: [11, 22], end: [12, 21] },
                { name: 'Oğlak',   start: [12, 22], end: [12, 31] }
            ];
            for (const sign of signs) {
                const [sMonth, sDay] = sign.start;
                const [eMonth, eDay] = sign.end;
                if ((month === sMonth && day >= sDay) || (month === eMonth && day <= eDay)) return sign.name;
            }
            return 'Bilinmiyor';
        }

        function getZodiacSignEn(signTr) {
            const map = {
                'Koç':'Aries','Boğa':'Taurus','İkizler':'Gemini','Yengeç':'Cancer',
                'Aslan':'Leo','Başak':'Virgo','Terazi':'Libra','Akrep':'Scorpio',
                'Yay':'Sagittarius','Oğlak':'Capricorn','Kova':'Aquarius','Balık':'Pisces'
            };
            return map[signTr] || signTr;
        }

        function getZodiacIconPath(signTr) {
            const signEn = getZodiacSignEn(signTr);
            return 'horoscope/' + signEn.toLowerCase() + '.png';
        }

        async function fetchHoroscopeFromGemini(signTr, signEn) {
            await remoteConfig.fetchAndActivate();
            const geminiApiKey = remoteConfig.getString('gemini_api_key');
            if (!geminiApiKey) throw new Error('API Key bulunamadı');

            const todayStr = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
            const focusAngles = [
                "Bugün özellikle içsel huzur, sezgiler ve ruhsal denge üzerine odaklan.",
                "Bugün kariyer, hedefler, sorumluluklar ve iş hayatındaki yeni fırsatlara odaklan.",
                "Bugün ikili ilişkiler, aşk, dostluklar ve sosyal bağlar üzerine odaklan.",
                "Bugün kişisel gelişim, enerji yönetimi, motivasyon ve atılacak cesur adımlara odaklan."
            ];
            const randomFocus = focusAngles[Math.floor(Math.random() * focusAngles.length)];

            const prompt = `Sen deneyimli ve sezgisel bir astrologsun. Bugün tarih ${todayStr}. ${signTr} (${signEn}) burcu için tamamen özgün, ezberden uzak ve taze bir günlük burç yorumu yaz.\n\nÖnemli Odak Noktası: ${randomFocus}\n\nKurallar:\n- Türkçe yaz.\n- Yorumun başında VEYA sonunda tarih, gün adı vb. BURÇ İSMİ BELİRTME. Doğrudan yoruma başla.\n- Asla birbirini tekrar eden kalıp astrolog cümleleri kullanma; her seferinde farklı metaforlar ve taze bir bakış açısı seç.\n- Samimi, derin ama profesyonel bir ton kullan.\n- 4-5 cümle olacak şekilde kısa ve öz tut.\n- Markdown, yıldız, numara kullanma. Düz metin yaz.\n- Günün enerjisini pozitif ama gerçekçi aktar.`;

            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
                method: 'POST',
                headers: { 'x-goog-api-key': geminiApiKey, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.9, maxOutputTokens: 512, thinkingConfig: { thinkingBudget: 0 } }
                })
            });

            const data = await response.json();
            const part = data.candidates?.[0]?.content?.parts?.[0];
            if (part?.text) return part.text.trim();
            if (data.error) throw new Error('Gemini API: ' + JSON.stringify(data.error));
            throw new Error('Beklenmeyen yanıt');
        }

        async function saveHoroscope(userId, sign, text) {
            const todayStr = new Date().toISOString().split('T')[0];
            const docRef = await db.collection('users').doc(userId).collection('horoscopes').add({
                sign, text, date: todayStr,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            return docRef.id;
        }

        async function loadTodayHoroscope(userId) {
            const todayStr = new Date().toISOString().split('T')[0];
            const query = await db.collection('users').doc(userId).collection('horoscopes')
                .where('date', '==', todayStr).limit(1).get();
            if (!query.empty) return { text: query.docs[0].data().text, sign: query.docs[0].data().sign };
            return null;
        }

        function updateHoroscopeUI(sign, text, dateStr) {
            const iconEl     = document.getElementById('horoscopeIcon');
            const signNameEl = document.getElementById('horoscopeSignName');
            const dateEl     = document.getElementById('horoscopeDate');
            iconEl.src = getZodiacIconPath(sign);
            iconEl.alt = sign;
            signNameEl.textContent = sign;
            document.getElementById('horoscopeTitle').textContent = t('dailyHoroscopeAreaTitle');
            document.getElementById('horoscopeDesc').textContent  = text;
            dateEl.textContent = dateStr; dateEl.classList.remove('hidden');
        }

        function showHoroscopeLoading() {
            document.getElementById('horoscopeSignName').textContent = '...';
            document.getElementById('horoscopeTitle').textContent    = t('dailyHoroscopeAreaTitle');
            document.getElementById('horoscopeDesc').textContent     = 'Yorum yükleniyor...';
            document.getElementById('horoscopeDate').classList.add('hidden');
        }

        function showHoroscopeEmpty() {
            document.getElementById('horoscopeIcon').src            = 'horoscope/gemini.png';
            document.getElementById('horoscopeSignName').textContent = 'Burç';
            document.getElementById('horoscopeTitle').textContent    = t('dailyHoroscopeAreaTitle');
            document.getElementById('horoscopeDesc').textContent     = t('dailyHoroscopeAreaDesc');
            document.getElementById('horoscopeDate').classList.add('hidden');
        }

        function openBirthModal() {
            closeSidebar();
            document.getElementById('birthModalMsg').textContent = '';
            if (userBirthInfo) {
                document.getElementById('birthModalDay').value   = userBirthInfo.day   || '';
                document.getElementById('birthModalMonth').value = userBirthInfo.month || '';
                document.getElementById('birthModalYear').value  = userBirthInfo.year  || '';
            }
            document.getElementById('birthModalOverlay').classList.add('active');
        }

        function closeBirthModal() {
            document.getElementById('birthModalOverlay').classList.remove('active');
        }

        document.getElementById('birthModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeBirthModal();
        });

        document.getElementById('birthModalSaveBtn').addEventListener('click', async function() {
            const user = auth.currentUser;
            if (!user) return;
            const day   = parseInt(document.getElementById('birthModalDay').value);
            const month = parseInt(document.getElementById('birthModalMonth').value);
            const year  = parseInt(document.getElementById('birthModalYear').value);
            const msg   = document.getElementById('birthModalMsg');
            if (!day || !month || !year) {
                msg.textContent = 'Lütfen tüm alanları doldurun.';
                msg.className = 'birth-msg error'; return;
            }
            try {
                await db.collection('users').doc(user.uid).set({
                    birthInfo: { day, month, year, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }
                }, { merge: true });
                userBirthInfo = { day, month, year };
                msg.textContent = 'Kaydedildi! Yorum hazırlanıyor...';
                msg.className = 'birth-msg success';
                closeBirthModal();
                const sign = getZodiacSign(day, month);
                showHoroscopeLoading();
                const aiText = await fetchHoroscopeFromGemini(sign, getZodiacSignEn(sign));
                await saveHoroscope(user.uid, sign, aiText);
                updateHoroscopeUI(sign, aiText, new Date().toLocaleDateString('tr-TR'));
            } catch (err) {
                msg.textContent = 'Hata: ' + err.message;
                msg.className = 'birth-msg error';
            }
        });

        async function loadAndShowHoroscope(userId, birthInfo) {
            if (!birthInfo?.day || !birthInfo?.month) { showHoroscopeEmpty(); return; }
            const sign = getZodiacSign(birthInfo.day, birthInfo.month);
            showHoroscopeLoading();
            const todayHoroscope = await loadTodayHoroscope(userId);
            if (todayHoroscope) {
                updateHoroscopeUI(todayHoroscope.sign, todayHoroscope.text, new Date().toLocaleDateString('tr-TR'));
            } else {
                try {
                    const aiText = await fetchHoroscopeFromGemini(sign, getZodiacSignEn(sign));
                    await saveHoroscope(userId, sign, aiText);
                    updateHoroscopeUI(sign, aiText, new Date().toLocaleDateString('tr-TR'));
                } catch (err) {
                    document.getElementById('horoscopeDesc').textContent = 'Yorum alınamadı. Tekrar deneyin.';
                }
            }
        }

        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.href = 'auth.html'; return; }

            document.getElementById('dashboardTitle').textContent       = t('dashboardTitle');
            document.getElementById('horoscopeTitle').textContent       = t('dailyHoroscopeAreaTitle');
            document.getElementById('horoscopeDesc').textContent        = t('dailyHoroscopeAreaDesc');
            document.getElementById('intentTitle').textContent          = t('intentTitle');
            document.getElementById('cooldownTitle').textContent        = t('cooldownTitle');
            document.getElementById('premiumFeature1').textContent      = t('premiumFeature1');
            document.getElementById('premiumFeature2').textContent      = t('premiumFeature2');
            document.getElementById('premiumCtaBtn').textContent        = t('premiumCtaBtn');
            document.getElementById('cooldownCloseBtn').textContent     = t('cooldownCloseBtn');
            document.getElementById('navHome').setAttribute('aria-label', t('navHomeLabel'));
            document.getElementById('sidebarBirthText').textContent     = t('sidebarBirth') || 'Doğum Tarihi';
            document.getElementById('sidebarCardsText').textContent     = t('sidebarCards');
            document.getElementById('sidebarLogoutText').textContent    = t('sidebarLogout');

            try {
                const userDoc   = await db.collection('users').doc(user.uid).get();
                const birthInfo = userDoc.exists ? userDoc.data().birthInfo : null;
                if (birthInfo?.day && birthInfo?.month) userBirthInfo = birthInfo;
                await loadAndShowHoroscope(user.uid, birthInfo);
            } catch (e) {
                console.log('Horoscope load error:', e);
                showHoroscopeEmpty();
            }

            await checkLastReading(user.uid);
            document.getElementById('authCheck').classList.add('hidden');
        });

        async function checkLastReading(userId) {
            try {
                const cachedTime = sessionStorage.getItem('tarotLastReadingTime');
                if (cachedTime && Date.now() - parseInt(cachedTime) < 24 * 60 * 60 * 1000) {
                    lockCards(formatRemainingTime(new Date(parseInt(cachedTime))));
                }

                const lastQuery = await db.collection('users').doc(userId)
                    .collection('readings').orderBy('createdAt', 'desc').limit(1).get();

                let hasValidAiComment = false;

                if (!lastQuery.empty) {
                    const lastData = lastQuery.docs[0].data();
                    if (lastData.aiInterpretation?.trim() && lastData.createdAt && isWithin24h(lastData.createdAt)) {
                        hasValidAiComment = true;
                    }
                    if (lastData.createdAt && isWithin24h(lastData.createdAt)) {
                        lockCards(formatRemainingTime(lastData.createdAt));
                    }
                }

                document.getElementById('topbarIcon').classList.toggle('hidden', !hasValidAiComment);

                if (!lastQuery.empty && lastQuery.docs[0].data().createdAt &&
                    isWithin24h(lastQuery.docs[0].data().createdAt)) return;

                unlockCards();
            } catch (e) {
                console.log('Last reading check error:', e);
                document.getElementById('topbarIcon').classList.add('hidden');
                lockCards(t('cooldownMessage'));
            }
        }

        function openSidebar()  { document.getElementById('sidebarOverlay').classList.add('active'); document.getElementById('sidebar').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }
        function logout()       { auth.signOut().then(() => { window.location.href = 'auth.html'; }); }

        document.getElementById('menuBtn').addEventListener('click', openSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        document.getElementById('sidebarBirthItem').addEventListener('click', openBirthModal);
        document.getElementById('topbarIcon').addEventListener('click', () => { window.location.href = 'result.html'; });

        let currentReadingType = null;
        const intentOverlay = document.getElementById('intentOverlay');
        const intentInput   = document.getElementById('intentInput');
        const charCounter   = document.getElementById('charCounter');
        const sendBtn       = document.getElementById('sendIntentBtn');

        function openIntentModal(type) {
            currentReadingType = type;
            intentInput.value = ''; charCounter.textContent = '0/200'; sendBtn.disabled = true;
            intentOverlay.classList.add('active'); intentInput.focus();
        }
        function closeIntentModal() { intentOverlay.classList.remove('active'); }

        intentInput.addEventListener('input', function() {
            charCounter.textContent = intentInput.value.length + '/200';
            sendBtn.disabled = intentInput.value.trim().length === 0;
        });
        intentOverlay.addEventListener('click', function(e) { if (e.target === intentOverlay) closeIntentModal(); });
        sendBtn.addEventListener('click', function() {
            const intentText = intentInput.value.trim();
            if (!intentText) return;
            sessionStorage.setItem('tarotIntent', intentText);
            sessionStorage.setItem('tarotReadingType', currentReadingType);
            window.location.href = 'cards.html';
        });

        document.getElementById('singleCardOption').addEventListener('click', function() {
            if (this.classList.contains('locked')) { openCooldownModal(); return; }
            openIntentModal('single');
        });
        document.getElementById('threeCardOption').addEventListener('click', function() {
            if (this.classList.contains('locked')) { openCooldownModal(); return; }
            openIntentModal('three');
        });

        const cooldownOverlay = document.getElementById('cooldownOverlay');
        function openCooldownModal() {
            document.getElementById('cooldownRemainingText').textContent = t('cooldownRemainingPrefix') + ' ' + cooldownRemaining;
            cooldownOverlay.classList.add('active');
        }
        function closeCooldownModal() { cooldownOverlay.classList.remove('active'); }

        document.getElementById('cooldownCloseBtn').addEventListener('click', closeCooldownModal);
        cooldownOverlay.addEventListener('click', function(e) { if (e.target === cooldownOverlay) closeCooldownModal(); });
        document.getElementById('premiumCtaBtn').addEventListener('click', function() {
            closeCooldownModal();
            document.getElementById('premiumSection')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        // ===== ZODIAC MODAL =====
        function openZodiacModal() {
            if (!userBirthInfo || !userBirthInfo.day || !userBirthInfo.month) {
                openBirthModal();
                return;
            }
            const sign = getZodiacSign(userBirthInfo.day, userBirthInfo.month);
            const data = ZODIAC_DATA[sign];
            if (!data) return;

            document.getElementById('zodiacModalIcon').src = getZodiacIconPath(sign);
            document.getElementById('zodiacModalIcon').alt = sign;
            document.getElementById('zodiacModalSignName').textContent = sign + ' Burcu';
            document.getElementById('zodiacModalTagline').textContent = data.tagline;
            document.getElementById('zodiacModalDates').textContent = data.dates;
            document.getElementById('zodiacModalElement').textContent = data.element;
            document.getElementById('zodiacModalRuler').textContent = data.ruler;

            const compatContainer = document.getElementById('zodiacModalCompatible');
            compatContainer.innerHTML = '';
            data.compatible.forEach(c => {
                const chip = document.createElement('span');
                chip.className = 'zodiac-compatible-chip';
                chip.textContent = c;
                compatContainer.appendChild(chip);
            });

            document.getElementById('zodiacModalBody').textContent = data.article;
            document.getElementById('zodiacModalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeZodiacModal() {
            document.getElementById('zodiacModalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('horoscopeOption').addEventListener('click', openZodiacModal);
        document.getElementById('zodiacModalClose').addEventListener('click', closeZodiacModal);
        document.getElementById('zodiacModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeZodiacModal();
        });
    </script>
</body>
</html>
